name: EC2 Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: gui-branch

      # TEMPORARY: prints only the key's public fingerprint (not secret material)
      # to confirm EC2_KEY is the same key pair the instance authorises.
      - name: Verify EC2_KEY fingerprint
        env:
          KEY: ${{ secrets.EC2_KEY }}
        run: |
          printf '%s\n' "$KEY" > /tmp/id_test && chmod 600 /tmp/id_test
          FP=$(ssh-keygen -lf /tmp/id_test | awk '{print $2}')
          echo "::notice::EC2_KEY fingerprint = $FP"
          echo "::notice::instance expects    = SHA256:pSxWxygWl0T8880aK6aG7ETv/RtV15ysixkHvBGNTMg"

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          # NOTE: The public IP changes every time the Learner Lab restarts or the
          # instance is stopped/started. Update this value when that happens.
          host: 54.172.116.208
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/dice
            bash ./resources/deploy_ec2.sh